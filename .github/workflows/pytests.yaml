name: pytest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: pytest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  cache_test_images:
    name: cache test images
    runs-on: ubuntu-latest
    steps:
      - name: Prevent cache-miss on windows
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Load test images from cache
        id: cache-test-images
        uses: actions/cache@v6
        with:
          key: test-images-cache-${{ hashFiles('tests/download_test_images.py') }}
          restore-keys: |
            test-images-cache-
          path: tests/testdata/slides
          enableCrossOsArchive: true
      - name: Download test images
        if: ${{ steps.cache-test-images.outputs.cache-hit != 'true' }}
        run: |
          python -m pip install -U pip
          python -m pip install requests
          python -u tests/download_test_images.py

  tests:
    needs: [cache_test_images]
    name: pytest ${{ matrix.os }}::py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      max-parallel: 8
      fail-fast: false
      matrix:
        # Every supported Python on Linux; oldest and newest on macOS and Windows.
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.14"
    steps:
      - name: Prevent cache-miss on windows
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Load test images from cache
        id: cache-test-images
        uses: actions/cache@v6
        with:
          key: test-images-cache-${{ hashFiles('tests/download_test_images.py') }}
          path: tests/testdata/slides
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      # opentile-jpeg (a workspace member) is built from source by uv sync; cache
      # its pinned libjpeg-turbo build so it is compiled once per pin and OS.
      - name: Cache libjpeg-turbo build
        uses: actions/cache@v6
        with:
          key: libjpeg-turbo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('opentile-jpeg/pyproject.toml', 'opentile-jpeg/tools/build_turbo.py') }}
          path: opentile-jpeg/.turbo
      # Persist uv's cache, which holds the opentile-jpeg wheel uv built, so a
      # later run can reuse it instead of compiling the extension again. The
      # key covers every input of that build: a change to any of them starts
      # from an empty cache rather than risk reusing a stale extension.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml
            opentile-jpeg/pyproject.toml
            opentile-jpeg/CMakeLists.txt
            opentile-jpeg/src/**
            opentile-jpeg/tools/**
      # uv prints "Built opentile-jpeg" when it compiles the extension, and
      # nothing about it when it reuses the cached wheel.
      - name: Install Application
        run: uv sync --all-extras
      - name: Test with pytest.
        run: uv run pytest
