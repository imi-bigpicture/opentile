[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.2"]
build-backend = "scikit_build_core.build"

[project]
name = "opentile-jpeg"
version = "0.1.0"
description = "Lossless JPEG operations in the DCT-coefficient domain: crop, compose, optimize, and fill without re-encoding."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "licenses/*"]
authors = [{ name = "Erik O Gabrielsson", email = "erik.o.gabrielsson@sectra.com" }]
keywords = ["jpeg", "lossless", "dct", "coefficient", "crop", "jpegtran", "whole slide image"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics",
    "Programming Language :: Python :: 3",
]
dependencies = ["numpy>=1.22"]

[project.urls]
Repository = "https://github.com/imi-bigpicture/opentile"

[tool.scikit-build]
wheel.packages = ["src/opentile_jpeg"]
sdist.exclude = [
    ".turbo", ".venv", "build", "dist", ".pytest_cache", ".ruff_cache",
    ".github", "*.pyd",
]

# nanobind's stable ABI exists only on Python >= 3.12: there, tag one abi3 wheel
# (cp312) that covers 3.12+. Below that, build normal per-version wheels
# (cp311). The STABLE_ABI flag in CMakeLists matches this per version.
[[tool.scikit-build.overrides]]
if.python-version = ">=3.12"
wheel.py-api = "cp312"

# The libjpeg-turbo that tools/build_turbo.py fetches and links statically.
# Pin both the version and its tarball hash: a tag alone is neither
# reproducible nor tamper-evident. Bump both together (compute with
# `sha256sum <tarball>`), and refresh the copies in licenses/.
[tool.opentile-jpeg.libjpeg-turbo]
version = "3.2.0"
sha256 = "980dd81f425082aa6d7c9e47fef27554ce7a9ffc8e2f6e863b97d263c5c50858"

[dependency-groups]
dev = [
    "pytest>=8.1.0",
    "numpy>=1.22.0",
    "pillow>=10.0",
    "hypothesis>=6.100",
]

[tool.cibuildwheel]
# cp311 -> a per-version wheel; cp312 -> one abi3 wheel covering 3.12+.
# cp313 re-emits that same abi3 wheel (harmless) but makes CI test-install and
# run it on 3.13, proving the "one wheel for 3.12+" claim on the newest Python.
build = "cp311-* cp312-* cp313-*"
# The runner's own architecture only: no 32-bit wheels (numpy and Pillow have no
# Linux i686 wheels to test with) and no emulated builds.
archs = ["native"]
build-frontend = "build"
test-requires = ["pytest", "numpy", "pillow", "hypothesis"]
test-command = "pytest {package}/tests --hypothesis-profile=ci"

[tool.cibuildwheel.macos.environment]
# nanobind needs macOS 10.14+ (std::optional and std::variant access); 10.15
# matches the x86_64 wheels of numpy and imagecodecs. arm64 starts at 11.0.
MACOSX_DEPLOYMENT_TARGET = "10.15"

[tool.ruff]
# The rules are opentile's; only what differs for this package is set here.
extend = "../pyproject.toml"
target-version = "py311"
# tests/ holds conftest.py, which the test modules import shared names from.
src = [".", "src", "tests"]
# Generated by nanobind at build time (verbatim C++ signatures); not hand-edited.
extend-exclude = ["*.pyi"]

[tool.pytest.ini_options]
filterwarnings = ["error::opentile_jpeg.errors.JpegWarning"]
